name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOWORK: "off"
  CGO_ENABLED: "0"

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      # ⛔ OpenLDAP's own client is the JUDGE. A server tested only by a
      # client from this same module can agree with it about a misreading of
      # the protocol and both be wrong -- which is exactly how the library
      # this replaces evaluated (uid=svc-*-prod) as (uid=svc-*) and its own
      # client reported the same answer. macOS ships ldapsearch; Windows has
      # none, and those tests skip there.
      - name: ldap-utils
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - run: go vet ./...
      - name: gofmt
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::these files are not gofmt-clean:"; echo "$unformatted"; exit 1
          fi
      - run: go test -count=1 ./...
        env:
          LDAP_REQUIRE_JUDGE: ${{ matrix.os == 'ubuntu-latest' && '1' || '' }}

  race:
    name: race detector
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      # ⛔ The judge belongs in EVERY lane that runs the tests. In the sibling
      # repo it was in `test` and nowhere else, so every judged test SKIPPED
      # here -- silently -- and this lane measured a third less than it
      # looked like it did.
      - name: ldap-utils
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - run: go test -race -count=1 ./...
        env:
          LDAP_REQUIRE_JUDGE: "1"

  coverage:
    name: coverage floor (99.7%, three unreachable lines)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      - name: ldap-utils
        run: sudo apt-get update && sudo apt-get install -y ldap-utils
      - env:
          LDAP_REQUIRE_JUDGE: "1"
        run: |
          # The org standard is 100%. THREE statements do not meet it and
          # cannot, and each is named rather than rounded away:
          #
          #  1. ldaptest Search, the EncodeFilter error branch. ldap.Filter is
          #     a SEALED interface, so nothing outside that package satisfies
          #     it and EncodeFilter is total over the nine that do.
          #  2. newCookie, the crypto/rand.Read failure.
          #  3. sendPage, the branch that answers when (2) happens.
          #
          # ⛔ (2) and (3) are reachable only by injecting a failing random
          # source, which would mean adding an API knob for the sake of a
          # coverage number. They are kept because a cookie that cannot be
          # made must not be silently skipped: an empty cookie means "this
          # was the last page", so skipping it would END the sequence and
          # lose the rest of the directory.
          #
          # ⛔ The floor is RAISED, never lowered. A lane that drops its floor
          # to go green has stopped measuring anything. It moved 99.5 -> 99.9
          # -> 99.7 only because paged results ADDED the two rand branches;
          # every other move has been upwards.
          FLOOR=99.7
          go test -coverprofile=cover.out -coverpkg=./... ./... >/dev/null
          go tool cover -func=cover.out
          cov=$(go tool cover -func=cover.out | tail -1 | awk '{print $3}' | tr -d '%')
          echo "coverage: ${cov}%  floor: ${FLOOR}%"
          # Written as an `if` and not `awk ... && { ... }`: in that form the
          # list's status is awk's, and as the last line of the script the
          # step inherits it -- so a lane comfortably above its floor fails
          # and says nothing about why.
          if awk -v c="$cov" -v f="$FLOOR" 'BEGIN{exit !(c+0 < f+0)}'; then
            echo "::error::coverage ${cov}% is below the floor ${FLOOR}%"
            exit 1
          fi

  arches:
    name: arch ${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64, riscv64, loong64, ppc64le, s390x]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with: { go-version: stable, check-latest: true, cache: true }
      - run: GOARCH=${{ matrix.goarch }} go build ./...
      - name: Install qemu-user-static
        if: matrix.goarch != 'amd64' && matrix.goarch != 'arm64'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq qemu-user-static
      - name: Test
        run: |
          case "${{ matrix.goarch }}" in
            amd64|arm64) go test -count=1 ./... ;;
            riscv64)  GOARCH=riscv64 go test -count=1 -exec=qemu-riscv64-static ./... ;;
            loong64)  GOARCH=loong64 go test -count=1 -exec=qemu-loongarch64-static ./... ;;
            ppc64le)  GOARCH=ppc64le go test -count=1 -exec=qemu-ppc64le-static ./... ;;
            s390x)    GOARCH=s390x   go test -count=1 -exec=qemu-s390x-static ./... ;;
          esac
